name: repro

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.platform }} (${{ matrix.os }}) / mqtt_client ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # mqtt5_client is fixed in 5.4.1 (see README); CI now covers mqtt_client.
        include:
          - { os: macos-latest, platform: safari, variant: 10.14.0 }
          - { os: macos-latest, platform: safari, variant: 10.14.0+fix }
          - { os: ubuntu-latest, platform: chrome, variant: 10.14.0 }
          - { os: ubuntu-latest, platform: chrome, variant: 10.14.0+fix }
          - { os: ubuntu-latest, platform: firefox, variant: 10.14.0 }
          - { os: ubuntu-latest, platform: firefox, variant: 10.14.0+fix }
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.0

      - name: Install Mosquitto (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mosquitto
          echo "MOSQUITTO=$(brew --prefix)/sbin/mosquitto" >> "$GITHUB_ENV"
      - name: Install Mosquitto (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto
          sudo systemctl disable --now mosquitto || true
          # Ubuntu's AppArmor profile for /usr/sbin/mosquitto only allows
          # config files under /etc/mosquitto; a copy elsewhere is unconfined.
          ls /etc/apparmor.d | grep -i mosquitto || true
          cp /usr/sbin/mosquitto "$RUNNER_TEMP/mosquitto"
          echo "MOSQUITTO=$RUNNER_TEMP/mosquitto" >> "$GITHUB_ENV"

      - name: Apply the one-line fix
        if: matrix.variant == '10.14.0+fix'
        run: tool/apply_fix_mqtt_client.sh

      - run: dart pub get
      - name: dart test -p ${{ matrix.platform }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dart test -p ${{ matrix.platform }} --reporter expanded test/mqtt_client_reconnect_test.dart
          else
            dart test -p ${{ matrix.platform }} --reporter expanded test/mqtt_client_reconnect_test.dart
          fi
